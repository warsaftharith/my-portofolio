  <!-- DOMAIN DETECTION -->
  <script>
    (function () {
      const redirectDomains = [
        "warsa-developer.my.id",
        "www.warsa-developer.my.id"
      ];

      const hostname = window.location.hostname.toLowerCase();

      if (redirectDomains.includes(hostname)) {
        document.documentElement.classList.add(
          "warsa-redirect"
        );
      }
    })();
  </script>

  <!-- REDIRECT LOADING STYLE -->
  <style>
    html.warsa-redirect,
    html.warsa-redirect body {
      margin: 0;
      min-height: 100%;
      background: #0B1220;
    }

    html.warsa-redirect #root {
      display: none !important;
    }

    #warsa-redirect-screen {
      display: none;
    }

    html.warsa-redirect #warsa-redirect-screen {
      position: fixed;
      inset: 0;
      z-index: 999999;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 0;
      padding: 24px;
      box-sizing: border-box;

      background: #0B1220;
      color: #F8FAFC;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      text-align: center;
    }

    .warsa-loading-brand {
      font-size: 23px;
      font-weight: 650;
      letter-spacing: -0.8px;
      line-height: 1.3;
    }

    .warsa-loading-subtitle {
      margin-top: 9px;

      font-size: 13px;
      font-weight: 400;
      line-height: 1.7;

      color: #94A3B8;
    }

    .warsa-loading-spinner {
      width: 27px;
      height: 27px;

      margin-bottom: 27px;

      border: 2px solid #334155;
      border-top-color: #E2E8F0;

      border-radius: 50%;

      animation:
        warsa-spin 0.8s linear infinite;
    }

    .warsa-loading-status {
      margin-top: 23px;

      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.3px;

      color: #64748B;
    }

    @keyframes warsa-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .warsa-loading-spinner {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- REDIRECT SCREEN -->
  <div
    id="warsa-redirect-screen"
    role="status"
    aria-live="polite"
  >
    <div
      class="warsa-loading-spinner"
      aria-hidden="true"
    ></div>

    <div class="warsa-loading-brand">
      Warsa Developer
    </div>

    <div class="warsa-loading-subtitle">
      Menghubungkan ke portofolio resmi...
    </div>

    <div class="warsa-loading-status">
      Mengalihkan halaman
    </div>
  </div>

  <!-- REACT APPLICATION -->
  <div id="root"></div>

  <!-- AUTOMATIC DOMAIN REDIRECT -->
  <script>
    (function () {
      const isRedirectDomain =
        document.documentElement.classList.contains(
          "warsa-redirect"
        );

      if (!isRedirectDomain) {
        return;
      }

      const destination =
        "https://portofolio-warsa.my.id/";

      const redirectDelay = 1200;

      window.setTimeout(function () {
        window.location.replace(destination);
      }, redirectDelay);
    })();
  </script>

  <!-- VITE / REACT ENTRY -->
  <script
    type="module"
    src="/src/main.tsx"
  ></script>

</body>
